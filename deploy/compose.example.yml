# Stand-alone FiGet: one container, SQLite and files on a volume.
#
#   FIGET_ADMIN_TOKEN=$(openssl rand -hex 32) docker compose -f deploy/compose.example.yml up -d --build
#
# Then sign in at http://localhost:8080 with that token. No image is published yet, so this builds locally.

services:
  figet:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: figet:local
    ports:
      - "8080:8080"
    environment:
      # The URL clients use. Behind a reverse proxy, set the public https URL here
      # (or set ASPNETCORE_FORWARDEDHEADERS_ENABLED=true and leave this empty).
      FiGet__PublicBaseUrl: "http://localhost:8080"
      FiGet__Auth__BootstrapAdminToken: "${FIGET_ADMIN_TOKEN:?Set FIGET_ADMIN_TOKEN to a long random secret}"
      FiGet__Feeds__0__Name: "modules"
      FiGet__Feeds__0__AnonymousRead: "true"
      FiGet__Feeds__1__Name: "internal"
      FiGet__Limits__MaxPackageSizeMB: "256"
      # SQL Server instead of SQLite:
      # FiGet__Database__Provider: "SqlServer"
      # FiGet__Database__ConnectionString: "Server=sql;Database=figet;User Id=figet;Password=...;TrustServerCertificate=True"
    volumes:
      - figet-data:/data
    restart: unless-stopped

volumes:
  figet-data:
