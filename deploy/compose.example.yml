# Stand-alone FiGet: one container, SQLite and files on a volume.
#
#   docker compose -f deploy/compose.example.yml up -d --build
#
# Then sign in at http://localhost:8080 as admin / admin and choose a new password. No image is published yet, so this
# builds locally.

services:
  figet:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: figet:local
    ports:
      - "8080:8080"
    environment:
      # The URL clients use. Behind a reverse proxy, the public https URL - and ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      # too, for the client's address; the switch does not replace this setting.
      FiGet__PublicBaseUrl: "http://localhost:8080"
      # Optional: a service token for automation from the first start, a long random secret.
      # FiGet__Auth__BootstrapAdminToken: "${FIGET_ADMIN_TOKEN}"
      FiGet__Feeds__0__Name: "modules"
      FiGet__Feeds__0__AnonymousRead: "true"
      FiGet__Feeds__1__Name: "internal"
      FiGet__Limits__MaxPackageSizeMB: "256"
      # SQL Server instead of SQLite:
      # FiGet__Database__Provider: "SqlServer"
      # FiGet__Database__ConnectionString: "Server=sql;Database=figet;User Id=figet;Password=...;TrustServerCertificate=True"
      # Shares an administrator may pick as the content of an asset directory: each one a sub-folder of this mount.
      # FiGet__Assets__SharesRoot: "/shares"
    volumes:
      - figet-data:/data
      # - /srv/shares/scripts:/shares/scripts:ro
    restart: unless-stopped

volumes:
  figet-data:
