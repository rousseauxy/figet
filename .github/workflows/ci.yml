name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway password for a service container that lives only for this job.
          MSSQL_SA_PASSWORD: "FiGet_ci_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FiGet_ci_Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      FIGET_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=FiGet_ci_Passw0rd!;TrustServerCertificate=True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Migrations match the model
        run: |
          dotnet ef migrations has-pending-model-changes --project src/FiGet.Infrastructure.Sqlite --no-build --configuration Release
          dotnet ef migrations has-pending-model-changes --project src/FiGet.Infrastructure.SqlServer --no-build --configuration Release

      - name: Test (SQLite and SQL Server)
        run: dotnet test --no-build --configuration Release

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: figet:ci

      - name: Start the image as an arbitrary UID and check health
        run: |
          docker run -d --name figet --user 1000123456:0 -p 8080:8080 \
            -e FiGet__Auth__BootstrapAdminToken=ci-admin-token-0123456789 \
            -e FiGet__Feeds__0__Name=ci -e FiGet__Feeds__0__AnonymousRead=true \
            figet:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health/ready
          curl -fsS http://localhost:8080/nuget/ci/v3/index.json | head -c 300
          docker logs figet 2>&1 | tail -20

  # A tag publishes; main only validates. The visibility check is a guard, not a policy: an image of a
  # private repository must not reach a public registry even if someone tags it early.
  #
  # One job per architecture, each on a runner of that architecture - hosted arm64 runners are free for
  # public repositories - because building arm64 under QEMU emulation costs a multiple of the time. Each
  # pushes an image without a tag and reports its digest; the job below joins the digests into one
  # multi-architecture tag, so `docker pull` on a NAS, a workstation or a cluster node gets its own.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
    needs: [build-and-test, container]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This job has no metadata step - that one belongs to the manifest job below - and the tag is what it is building.
      - name: Name this build after the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          # So the running server can say which release it is, without anyone reading the image tag back off the cluster.
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      # Named by the bare hex: an artifact file name may not contain the colon of "sha256:".
      - name: Keep the digest for the manifest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # One tag over both architectures. Without this each build would overwrite the other's tag and half the
  # fleet would pull an image it cannot run.
  manifest:
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Join the digests into one tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create             $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")             $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
