name: Dependencies

# A daily look at what is known to be vulnerable in this project, and a weekly one at what is behind.
#
#   report   NuGet packages with a known vulnerability (dotnet list package --vulnerable) fail the
#            run; on Monday or by hand, outdated packages and aged base-image pins are listed too
#   images   the published image, through osv.dev: its Ubuntu packages as osv-scanner reads them,
#            and the .NET runtime read out of the image (no scanner sees it). Only a finding with a
#            fix available fails the run; on Monday the rest is counted
#
# A failed scheduled run is the signal: GitHub sends it by mail. The scripts in tools/ci are shared
# with sibling projects and kept identical to theirs.
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PROJECT: FiGet
  OSV_SCANNER_VERSION: v2.7.0

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore figet.slnx
      - name: List vulnerable and outdated packages
        run: |
          dotnet list figet.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          dotnet list figet.slnx package --outdated --format json > outdated.json
      - name: Report
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$(date -u +%u)" = "1" ]; then
            node tools/ci/dependency-report.mjs --vulnerable vulnerable.json --outdated outdated.json --images deploy/Dockerfile
          else
            node tools/ci/dependency-report.mjs --vulnerable vulnerable.json
          fi

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install osv-scanner
        run: |
          base=https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION
          curl -fsSLO "$base/osv-scanner_linux_amd64"
          curl -fsSLO "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          install -m 755 osv-scanner_linux_amd64 osv-scanner
      - name: Scan the published image and report
        env:
          EVENT: ${{ github.event_name }}
        run: |
          images=$(sh tools/ci/image-scan.sh figet=ghcr.io/rousseauxy/figet:latest)
          weekly=""
          if [ "$EVENT" != "schedule" ] || [ "$(date -u +%u)" = "1" ]; then weekly="--weekly"; fi
          node tools/ci/image-report.mjs $images $weekly
